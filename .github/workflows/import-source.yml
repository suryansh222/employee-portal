name: Import employee portal source

on:
  push:
    paths:
      - '.upload_ready'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct source package
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_parts/part-* | base64 --decode > /tmp/source.zip
          rm -rf /tmp/source
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          cp -a /tmp/source/employee-portal/. .
          rm -rf .upload_parts .upload_ready
      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Upload complete employee portal source'
          git push
